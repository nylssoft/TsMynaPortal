<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open password backup</title>
  <link rel="stylesheet" href="./css/styles.scss">
  <script type="module" src="./js/password-backup.js"></script>
</head>
<body>
  <main class="container py-4">
    <h1 class="h3" data-label="title">Open password backup</h1>
    <p class="text-body-secondary" data-label="intro">Open an exported password ZIP with its export passphrase. No sign-in is required and nothing is uploaded.</p>
    <noscript>JavaScript is required to decrypt the backup in your browser.</noscript>
    <form id="backup-form" class="card p-3 p-sm-4 mb-3" autocomplete="off" hidden>
      <div class="mb-3">
        <label for="backup-file" class="form-label" data-label="file">Exported ZIP file</label>
        <input id="backup-file" class="form-control" type="file" accept=".zip,application/zip" required>
      </div>
      <div class="mb-3">
        <label for="backup-passphrase" class="form-label" data-label="passphrase">Export passphrase</label>
        <input id="backup-passphrase" class="form-control" type="password" autocomplete="off" spellcheck="false" required>
      </div>
      <button id="backup-open" type="submit" class="btn btn-primary align-self-start" data-label="unlock">Unlock backup</button>
    </form>
    <p id="backup-error" class="alert alert-danger" role="alert" hidden></p>
    <p id="backup-status" role="status" class="text-body-secondary"></p>
    <section id="backup-view" class="card p-3 p-sm-4" aria-labelledby="backup-entries-heading" hidden>
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 id="backup-entries-heading" class="h5 mb-0" data-label="entries">Password entries</h2>
        <button id="backup-lock" type="button" class="btn btn-outline-secondary" data-label="lock">Lock backup</button>
      </div>
      <p class="small text-body-secondary" data-label="idleHelp">The backup locks after two minutes of inactivity. Copied passwords may remain on your clipboard.</p>
      <label for="backup-search" class="form-label" data-label="search">Search by name, username or website</label>
      <input id="backup-search" class="form-control mb-3" type="search" autocomplete="off" spellcheck="false">
      <label for="backup-items" class="form-label" data-label="choose">Choose an entry</label>
      <select id="backup-items" class="form-select mb-3" autocomplete="off"></select>
      <div id="backup-details"></div>
    </section>
  </main>
</body>
</html>
